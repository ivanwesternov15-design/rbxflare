<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Профиль — Uxintace</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=0e68a40">
</head>
<body>

<div id="app-wallpaper"></div>

<div class="page">
  <div class="card">

    <div class="top-bar">
      <!-- Кнопка выхода удалена по ТЗ. При необходимости верните её сюда. -->
      <button class="icon-btn" id="menuBtn" aria-label="Меню">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></svg>
      </button>
    </div>

    <div class="banner" id="banner"></div>

    <div class="avatar-wrap">
      <div class="avatar-ring">
        <div class="avatar-photo" id="avatarPhoto"></div>
      </div>
    </div>

    <div class="identity">
      <div class="name-row">
        <div class="owner-badge" id="ownerBadge" style="display:none">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4 3 5-6 5 6 4-3-2 11H5L3 8z"/></svg>
          ВЛАДЕЛЕЦ
        </div>
        <div class="display-name" id="displayName">—</div>
      </div>
      <div class="handle-row">
        <span class="handle" id="handle">@—</span>
        <span class="id-pill" id="idPill">ID: —</span>
      </div>
    </div>

    <div class="panel" id="bioPanel">
      <div class="panel-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        О себе
      </div>
      <div class="panel-value" id="bioValue">Загружается…</div>
    </div>

    <div class="panel" id="datePanel">
      <div class="panel-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="8" cy="14" r="1.2" fill="currentColor" stroke="none"/></svg>
        <span id="dateLabel">Первый вход</span>
      </div>
      <div class="panel-value" id="dateValue">Загружается…</div>
    </div>

  </div>
</div>

<!-- ============ ШТОРКА НАСТРОЙКИ ВНЕШНЕГО ВИДА ============ -->
<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-head">
    <div class="sheet-title">Внешний вид</div>
    <button class="sheet-close" id="sheetClose" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>

  <div class="tabs">
    <div class="tab-indicator" id="tabIndicator"></div>
    <button class="tab-btn active" data-tab="fons">Фон карточки</button>
    <button class="tab-btn" data-tab="podfons">Фон приложения</button>
  </div>

  <div class="sheet-body">
    <div class="grid fade-pane" id="grid"></div>
  </div>
</div>

<!-- ============ НИЖНЯЯ НАВИГАЦИЯ ============ -->
<nav class="bottom-nav" id="bottomNav">
  <div class="nav-indicator" id="navIndicator"></div>
  <button class="nav-btn" data-view="main" aria-label="Главное">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
    <span>Главное</span>
  </button>
  <button class="nav-btn" data-view="cards" aria-label="Мои карточки">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="16" height="14" rx="3"/><path d="M6 5V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1.5"/></svg>
    <span>Карточки</span>
  </button>
  <button class="nav-btn" data-view="refs" aria-label="Реффералы">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5c2.6.3 5 2.1 5 5.5"/></svg>
    <span>Реффералы</span>
  </button>
  <button class="nav-btn" data-view="tasks" aria-label="Задания">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="17" rx="3.5"/><path d="M8.5 12l2.5 2.5 4.5-4.5"/></svg>
    <span>Задания</span>
  </button>
  <button class="nav-btn active" data-view="profile" aria-label="Профиль">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c0-4.2 3.4-7.5 7.5-7.5s7.5 3.3 7.5 7.5"/></svg>
    <span>Профиль</span>
  </button>
</nav>

<script src="script.js?v=7d75d27"></script>
</body>
</html>
